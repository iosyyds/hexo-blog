# 友链数据文件（可在此添加你的好友链接）
# 格式说明：
#   flink:
#     - class_name: 分组名称
#       descr: 分组描述
#       link_list:
#         - name: 昵称
#           link: 网站地址
#           avatar: 头像地址
#           descr: 一句描述
#
# 示例（请替换成你自己的友链）：
flink:
  - class_name: 我的伙伴
    descr: 欢迎交换友链，先添加本站后留言即可
    link_list:
      - name: AnZhiYu 主题
        link: https://hexo.anheyu.com/
        avatar: https://bu.dusays.com/2023/04/27/64496e511b09c.jpg
        descr: 主题作者
